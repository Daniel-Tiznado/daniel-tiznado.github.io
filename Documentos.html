<style>

/* =========================================================
   RESET
========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;

    background:
    radial-gradient(circle at 10% 20%, rgba(0,255,150,0.35), transparent 25%),
    radial-gradient(circle at 90% 80%, rgba(0,140,255,0.35), transparent 25%),
	radial-gradient(circle at 50% 50%, rgba(0,200,200,0.10), transparent 50%),
    linear-gradient(135deg,#000000,#002f2f,#000000);

    background-attachment:fixed;
    overflow-x:hidden;
}


/* =========================================================
   BARRAS LATERALES
========================================================= */

.left-dark,
.right-dark{
    position:fixed;
    top:0;
    width:60px;
    height:100%;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:30px;
    backdrop-filter:blur(5px);
    transition:.4s;
}

.left-dark{
    left:0;
    background:rgba(198,109,26,0.05);
}

.right-dark{
    right:0;
    background:rgba(0,126,192,0.05);
}

.left-dark:hover{
    width:65px;
    background:#c66d1a;
}

.right-dark:hover{
    width:65px;
    background:#007ec0;
}

.icon-link{
    color:#fff;
    font-size:22px;

    padding:10px;
    border-radius:8px;

    transition:.3s;
}

.icon-link:hover{
    background:rgba(255,255,255,.2);
    transform:scale(1.2);
}


/* =========================================================
   CONTENEDOR
========================================================= */

.container{
    margin-left:80px;
    margin-right:80px;
    padding:40px;
}

.main-content{
    max-width:850px;
    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    margin-bottom:40px;
    text-align:center;
}

.header h1{
    font-size:2.7rem;
    margin-bottom:20px;

    background:linear-gradient(135deg,#00bfff,#00ff95);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header p{
    color:#aaa;
    line-height:1.8;
    max-width:750px;
    margin:auto;
}


/* =========================================================
   BOTON PANEL
========================================================= */

.btn-categoria{
    position:fixed;
    top:20px;
    left:80px;
    z-index:120;

    border:none;
    cursor:pointer;

    padding:12px 16px;
    border-radius:10px;

    color:#fff;

    background:linear-gradient(135deg,#007ec0,#00bfff);

    box-shadow:0 0 15px rgba(0,140,255,.4);

    transition:.3s;
}

.btn-categoria:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(0,140,255,.6);
}


/* =========================================================
   PANEL
========================================================= */

.panel{
    position:fixed;
    top:0;
    left:-320px;

    width:280px;
    height:100%;

    z-index:110;

    padding:20px;

    backdrop-filter:blur(12px);

    background:rgba(20,20,20,.95);

    border-right:1px solid rgba(255,255,255,.05);

    transition:left .5s cubic-bezier(.25,.8,.25,1);
}

.panel.active{
    left:65px;
}

.panel h4{
    margin-top:50px;
    margin-bottom:15px;
    color:#999;
}

.item{
    padding:10px;
    border-radius:8px;
    cursor:pointer;

    transition:.2s;
}

.item:hover{
    background:#333;
}


/* =========================================================
   TARJETAS
========================================================= */

.tarjeta{
  background:#161616;    
  border:1px solid #2d2d2d;    
  border-radius:16px;    
  margin-bottom:25px;    
  overflow:hidden;    
  transition:.35s;	
}

.tarjeta:hover{
    transform:translateY(-5px);
}

.tarjeta-titulo{
	position: relative;
	overflow: hidden;
    background:#222;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:1.05rem;
    font-weight:bold;
}

.icono{
    transition:.3s;
}

.tarjeta.activa .icono{
    transform:rotate(180deg);
}

/* ===== EFECTO HOVER ===== */
.tarjeta-titulo::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(0,255,200,0.4), transparent);
    transition:0.5s;
}

.tarjeta-titulo:hover::before{
    left:100%;
}

/* LÍNEA */
.tarjeta-titulo::after{
    content:'';
    position:absolute;
    width:200%;
    height:2px;
    background:rgba(255,255,255,0.3);
    transform:rotate(25deg);
    top:50%;
    left:-150%;
    transition:0.5s;
}

.tarjeta-titulo:hover::after{
    left:100%;
}










/* =========================================================
   CONTENIDO
========================================================= */

.contenido{
    height:0;
    overflow:hidden;

    transition:height .6s ease;

    padding:0 18px;
}

.inner{
    display:flex;
    gap:20px;

    padding:20px 0;
}

@media(max-width:700px){

    .inner{
        flex-direction:column;
    }

    .img-doc{
        width:100% !important;
        height:220px !important;
    }

}


/* =========================================================
   IMAGEN
========================================================= */

.img-doc{
    width:220px;
    height:140px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #333;
}


/* =========================================================
   TEXTO
========================================================= */

.texto{
    flex:1;
}

.insight{
    color:#d0d0d0;
    font-style:italic;
    line-height:1.6;
    margin-bottom:15px;
}

.bullets{
    padding-left:20px;
    color:#bbb;
    line-height:1.7;
}

.bullets li{
    margin-bottom:8px;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
    margin-bottom:15px;
}

.badge{
    display:inline-block;

    padding:5px 10px;
    border-radius:8px;

    font-size:12px;
    margin-right:8px;
}

.categoria{
    background:#00bfff33;
    color:#00bfff;
}

.tipo{
    background:#00ff9533;
    color:#00ff95;
}


/* =========================================================
   RESUMEN
========================================================= */

.ver-mas{
    display:inline-block;

    margin-top:15px;

    color:#00bfff;

    cursor:pointer;
}

.resumen{
    display:none;

    margin-top:15px;

    border-top:1px solid #333;

    padding-top:15px;

    line-height:1.7;
    color:#bbb;
}

.resumen.activo{
    display:block;
}

.doc-link{
    display:inline-block;
    margin-top:15px;

    color:#00ff95;
    cursor:pointer;
}


/* =========================================================
   GLOW
========================================================= */

.tarjeta.highlight{
    box-shadow:
    0 0 10px rgba(0,255,150,.5),
    0 0 20px rgba(0,140,255,.4),
    0 0 40px rgba(0,255,150,.2);
}


/* =========================================================
   MODAL PDF
========================================================= */

.modal{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.9);

    z-index:999;
}

.modal-content{
    width:85%;
    height:90%;

    background:#fff;

    border-radius:10px;

    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}


/* =========================================================
   EFECTO FILTRO
========================================================= */

#fx-filter{
    position:fixed;
    top:0;
    left:-150%;

    width:200%;
    height:100%;

    z-index:300;

    pointer-events:none;

    background:linear-gradient(
    120deg,
    transparent 40%,
    rgba(0,255,150,.18) 50%,
    rgba(0,140,255,.18) 55%,
    transparent 65%
    );
}

.fx-active{
    animation:sweep .6s ease;
}

@keyframes sweep{

    0%{
        left:-150%;
    }

    100%{
        left:150%;
    }

}


/* ============================================
   COMPONENTES MÓVILES (ocultos en desktop)
   ============================================ */
.mobile-menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    z-index:200;
    width:48px;
    height:48px;
    background:rgba(10,10,15,0.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    transition:all 0.3s ease;
    pointer-events:auto;
}

.mobile-menu-btn:hover{
    background:rgba(198,109,26,0.2);
    border-color:#c66d1a;
}

.mobile-menu-btn:active{
    transform:scale(0.95);
}

.mobile-nav-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(3px);
    z-index:180;
    opacity:0;
    transition:opacity 0.3s ease;
    pointer-events:none;
}

.mobile-nav-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.mobile-nav{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100vh;
    background:rgba(15,15,20,0.98);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    border-right:1px solid rgba(255,255,255,0.08);
    z-index:190;
    padding:80px 0 30px;
    transform:translateX(-100%);
    transition:transform 0.4s cubic-bezier(0.23,1,0.32,1);
    overflow-y:auto;
    pointer-events:auto;
}

.mobile-nav.active{
    transform:translateX(0);
}

.mobile-nav-close{
    position:absolute;
    top:15px;
    right:15px;
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.1);
    border:none;
    border-radius:50%;
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.3s ease;
    pointer-events:auto;
}

.mobile-nav-close:hover{
    background:rgba(198,109,26,0.3);
    transform:rotate(90deg);
}

.mobile-nav-header{
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:25px;
    padding:0 25px 15px;
    border-bottom:2px solid #c66d1a;
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
}

.mobile-nav-header i{
    color:#c66d1a;
}

.mobile-nav-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 25px;
    color:rgba(255,255,255,0.85);
    text-decoration:none;
    font-size:1rem;
    transition:all 0.2s ease;
    border-left:3px solid transparent;
    pointer-events:auto;
}

.mobile-nav-item:hover,
.mobile-nav-item.active{
    background:rgba(198,109,26,0.1);
    color:#c66d1a;
    border-left-color:#c66d1a;
    padding-left:28px;
}

.mobile-nav-item i{
    width:24px;
    text-align:center;
    font-size:1.1rem;
    color:rgba(255,255,255,0.6);
    transition:color 0.2s ease;
}

.mobile-nav-item:hover i,
.mobile-nav-item.active i{
    color:#c66d1a;
}

.mobile-bottom-bar{
    display:none;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:rgba(10,10,15,0.95);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.08);
    z-index:100;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
    pointer-events:auto;
}

.mobile-bottom-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:rgba(255,255,255,0.6);
    text-decoration:none;
    font-size:0.65rem;
    transition:all 0.3s ease;
    flex:1;
    height:100%;
    padding:8px 0;
    pointer-events:auto;
    position:relative;
    z-index:101;
}

.mobile-bottom-item i{
    font-size:1.3rem;
    transition:all 0.3s ease;
}

.mobile-bottom-item:hover,
.mobile-bottom-item.active{
    color:#c66d1a;
}

.mobile-bottom-item.active i{
    transform:scale(1.1);
}

.mobile-nav::-webkit-scrollbar{
    width:4px;
}

.mobile-nav::-webkit-scrollbar-track{
    background:transparent;
}

.mobile-nav::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.15);
    border-radius:2px;
}

.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border-width:0;
}

/* ============================================
   MEDIA QUERIES RESPONSIVE ADAPTADAS
   ============================================ */

        overflow-y:auto;

    cards.innerHTML = lista.map(card => `

    <div class="tarjeta"

		data-tipo="${card.tipo.toLowerCase()}"
		data-estado="${card.estado.toLowerCase()}">

        <div class="tarjeta-titulo">

            <span>${card.titulo}</span>

            <span class="icono">
                <i class="fas fa-chevron-down"></i>
            </span>

        </div>

        <div class="contenido">

            <div class="inner">

                ${card.img ? `
                <img class="img-doc"
                     src="${card.img}">
                ` : ''}

                <div class="texto">

                    <div class="badges">

                        <span class="badge categoria">
                            ${card.categoria}
                        </span>

                        <span class="badge tipo">
                            ${card.tipo}
                        </span>

                    </div>

                    ${card.insight ? `
                    <p class="insight">
                        ${card.insight}
                    </p>
                    ` : ''}

                    ${card.bullets ? `
                    <ul class="bullets">

                        ${card.bullets.map(item => `
                        <li>${item}</li>
                        `).join('')}

                    </ul>
                    ` : ''}

                    ${card.resumen ? `

                    <span class="ver-mas">
                        Resumen del documento ...
                    </span>

                    <div class="resumen">

                        <p>${card.resumen}</p>

                        <span class="doc-link">
                            Ver documento
                        </span>

                    </div>

                    ` : ''}

                </div>

            </div>

        </div>

    </div>

    `).join('');

}

/* =========================================================

========================================================= */
document.addEventListener("click", function(e){

    const titulo = e.target.closest(".tarjeta-titulo");

    if(titulo){

        const tarjeta = titulo.closest(".tarjeta");

        const contenido = tarjeta.querySelector(".contenido");

        tarjeta.classList.toggle("activa");

        if(contenido.style.height &&
           contenido.style.height !== "0px"){

            contenido.style.height = "0px";

        }else{

            contenido.style.height =
            contenido.scrollHeight + "px";

            // Centrar tarjeta al abrir
            setTimeout(() => {
                tarjeta.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }, 400);

        }

    }

});

        resumen.classList.toggle("activo");

        // Primero: asegurar que la tarjeta está abierta
        if(!tarjeta.classList.contains("activa")){
            tarjeta.classList.add("activa");
        }

        // Expandir contenido si está cerrado
        if(!contenido.style.height || contenido.style.height === "0px"){
            contenido.style.height = contenido.scrollHeight + "px";
        } else {
            // Si ya está abierta, recalcular por si el resumen agregó altura
            contenido.style.height = "auto";
            contenido.style.height = contenido.scrollHeight + "px";
        }

        // Scroll con delay para esperar el render
        setTimeout(() => {
            tarjeta.scrollIntoView({
                behavior: 'smooth',
                block: 'center'   // 'center' funciona mejor que 'nearest' para resúmenes largos
            });
        }, 350);  // espera la animación CSS + render del resumen

    }

});

document.getElementById("pdfViewer");

        const tarjeta =
        e.target.closest(".tarjeta");

        const titulo =
        tarjeta.querySelector(".tarjeta-titulo span").innerText;

        const doc = data.find(x =>
            x.titulo === titulo
        );

        if(doc){

            pdfViewer.src = doc.pdf;

            modal.style.display = "flex";
        }

    }

});

modal.addEventListener("click", function(){

    modal.style.display = "none";

    pdfViewer.src = "";

});

/* =========================================================
   FILTROS
========================================================= */
function resetVista(){
    panel.classList.remove("active");
    efectoFiltro();
}

function filtrar(cat, e){
    e.stopPropagation();
    cerrarTodasLasTarjetas();  // ← CIERRA TODO PRIMERO
    resetVista();
    const filtro = cat.toLowerCase();
    document.querySelectorAll('.tarjeta').forEach(t => {
        const categoria = (t.dataset.categoria || '').toLowerCase();
        t.style.display = (filtro === "todas" || categoria === filtro) ? "block" : "none";
    });
    glowTarjetas();
}

/* =========================================================
   EFECTO FILTRO
========================================================= */

function efectoFiltro(){
    const fx = document.getElementById("fx-filter");
    fx.classList.remove("fx-active");
    void fx.offsetWidth;
    fx.classList.add("fx-active");
}



/* =========================================================
   GLOW
========================================================= */

function glowTarjetas(){
    const visibles = document.querySelectorAll('.tarjeta');
    visibles.forEach((t, i) => {
        if(t.style.display === "none") return;
        setTimeout(() => {
            t.classList.add("highlight");
        }, i * 80);
    });

    setTimeout(() => {
        visibles.forEach(t => {
            t.classList.remove("highlight");
        });
    }, 1500);
}

/* =========================================================
   CERRAR TODAS LAS TARJETAS
========================================================= */
function cerrarTodasLasTarjetas(){
    document.querySelectorAll('.tarjeta').forEach(t => {
        t.classList.remove('activa');
        const contenido = t.querySelector('.contenido');
        if(contenido) contenido.style.height = '0px';
        const resumen = t.querySelector('.resumen');
        if(resumen) resumen.classList.remove('activo');
    });
}


/* ========== MENÚ LATERAL MÓVIL ========== */
function initMobileMenu(){
    const menuBtn = document.getElementById('mobileMenuBtn');
    const mobileNav = document.getElementById('mobileNav');
    const overlay = document.getElementById('mobileNavOverlay');
    const closeBtn = document.getElementById('mobileNavClose');

    function openMenu(){
        mobileNav.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeMenu(){
        mobileNav.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    menuBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    mobileNav.querySelectorAll('.mobile-nav-item').forEach(function(item){
        item.addEventListener('click', function(){
            closeMenu();
        });
    });

    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            closeMenu();
        }
    });

    var navTouchStartX = 0;
    mobileNav.addEventListener('touchstart', function(e){
        navTouchStartX = e.touches[0].clientX;
    }, { passive: true });

    mobileNav.addEventListener('touchend', function(e){
        var diff = navTouchStartX - e.changedTouches[0].clientX;
        if(diff > 80){
            closeMenu();
        }
    }, { passive: true });
}

initMobileMenu();
